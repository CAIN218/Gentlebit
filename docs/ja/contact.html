    <body class="page-contact page-sub">
        <div class="bg" aria-hidden="true"></div>
        <header class="top" id="top">
            <a class="brand" href="index.html">Gentlebit</a>
            <nav aria-label="Main">
                <a href="index.html#news">News</a>
                <a href="index.html#apps">Apps</a>

                <span class="lg2" role="group" aria-label="Language"><a href="../contact.html" hreflang="en" lang="en">EN</a><a href="contact.html" hreflang="ja" lang="ja" aria-current="true">JP</a></span>
            </nav>
        </header>
        <main class="wrap sub">
<div class="contact-card">
                    <a href="index.html" class="card-back-btn">← 戻る</a>
                    <h1>Contact</h1>
                    <span class="subtitle">ご質問や不具合の報告、ご感想などお気軽にどうぞ。</span>
                    <form class="form" action="https://formspree.io/f/xkoldvjp" method="POST">
                        <div class="form-group">
                            <label for="name">お名前</label>
                            <input type="text" id="name" name="name" class="form-control" required placeholder="山田 太郎">
                        </div>
                        <div class="form-group">
                            <label for="email">メールアドレス</label>
                            <input type="email" id="email" name="_replyto" class="form-control" required placeholder="you@example.com">
                        </div>
                        <div class="form-group">
                            <label for="message">メッセージ</label>
                            <textarea id="message" name="message" class="form-control" required placeholder="お問い合わせ内容をご記入ください"></textarea>
                        </div>
                        <div class="action-container">
                            <button type="submit" class="submit-btn">送信する</button>
                        </div>
                    </form>
                    <p class="form-note">送信すると、<a href="privacy.html">プライバシーポリシー</a>に記載の取り扱いに同意したものとみなします。</p>
                </div>
        </main>
